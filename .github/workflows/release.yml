# npm 发布（trusted publishing / OIDC——npm 侧已配置：
#   package ai-fly ↔ repo Gaubee/ai-fly ↔ workflow release.yml ↔ environment npm-publish）
# 触发：v* tag。流程：装依赖 → typecheck → vitest → tsdown 构建 → 版本对齐
# 校验（tag == package.json version）→ npm publish（无 token，OIDC 声明身份
# + --provenance）→ GitHub Release。
# 注意：npm 包只收 CLI 面（package.json files = dist 根）；桌面 app 的
# opentray 暂存宿主是平台相关产物，不随本包发布。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # GitHub Release
  id-token: write # npm trusted publishing（OIDC）

jobs:
  npm-publish:
    name: build & npm publish
    runs-on: ubuntu-latest
    # 与 npm 侧 trusted publishing 配置一致的环境名（npm 配了环境则必须声明，
    # 未配置则需删除本行——两侧对齐才能通过校验）
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      # pnpm@12.3.4（packageManager 字段）+ Node 24（npm ≥11.5 才支持
      # trusted publishing 的 OIDC 声明）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # 生成 app 图标（resources/app-icons 是 gitignore 的构建产物，单测
      # projectAppIcon 依赖其存在；sharp/@opentray 生成器在 ubuntu 可用）
      - name: app icons
        run: pnpm app:icons

      - name: typecheck
        run: pnpm typecheck

      # vitest 单测（integration/e2e 依赖本机端口与原生面，不进发布门禁）
      - name: unit tests
        run: pnpm test

      - name: build
        run: pnpm build

      - name: version guard (tag == package.json)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag $GITHUB_REF_NAME != package.json $PKG_VERSION" >&2
            exit 1
          fi

      # dist-tag 从 tag 推导：v0.3.0-alpha.1 → alpha（预发布通道）；
      # 正式版 → latest。npm 侧只有 latest 是默认安装目标，alpha 需
      # `npx ai-fly@alpha` / `npm i -g ai-fly@alpha` 显式指定。
      - name: resolve dist-tag
        if: startsWith(github.ref, 'refs/tags/')
        id: dist
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            CHANNEL="${GITHUB_REF_NAME#v}"      # v0.3.0-alpha.1 -> 0.3.0-alpha.1
            CHANNEL="${CHANNEL#*-}"             # -> alpha.1（剥到第一个 '-'）
            CHANNEL="${CHANNEL%%.*}"            # -> alpha
            echo "tag=${CHANNEL}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # trusted publishing：不设 NODE_AUTH_TOKEN / registry-url——npm 以
      # OIDC 声明身份；非 scoped 包默认 public。
      # --provenance 暂缺：npm 的 sigstore 溯源只支持 public 源仓库；本仓库
      # 转 public 后把 --provenance 加回来（trusted publishing 不受影响）
      - name: npm publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --tag "${{ steps.dist.outputs.tag }}"
      - name: npm publish (manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm publish --tag alpha

      - name: github release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--generate-notes --verify-tag)
          if [[ "${{ steps.dist.outputs.tag }}" != "latest" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${ARGS[@]}"
