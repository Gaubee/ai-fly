<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ai-fly">
  <!-- ai-fly brand symbol: a dart (paper plane) flying over a bridge arc.
       Hue 95 amber (#fdd309, opendweb family). Monochrome-first geometry with
       exaggerated stroke weights so the glyph stays legible at tray/icon sizes;
       the app-icon generator re-tiles it onto the native safe-area tile. -->
  <!-- upper wing: nose -> tail top -> fold notch -->
  <path d="M 716 192 L 256 448 L 416 500 Z" fill="#fdd309"/>
  <!-- keel: nose -> fold base -> keel bottom -->
  <path d="M 716 192 L 440 520 L 492 628 Z" fill="#fdd309"/>
  <!-- bridge arc -->
  <path d="M 340 856 A 172 172 0 0 1 684 856" fill="none" stroke="#fdd309"
        stroke-width="96" stroke-linecap="round"/>
</svg>
