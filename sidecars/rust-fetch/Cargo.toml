[package]
name = "rust-fetch"
version = "0.1.0"
edition = "2021"
description = "ai-fly outbound fetch sidecar: rustls TLS + HTTP/2, stdio protocol (frozen in openspec rust-fetch-sidecar)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
